name: ELV8
description: >-
  ELV8 Inc. operates Scout, a financial platform built for college athletes and
  athletic departments navigating Name, Image, and Likeness (NIL) income. Scout
  provides NIL income tracking and management, financial education with one-on-one
  coaching, payment processing for schools (per diems, bonuses, and NIL payments),
  roster cap-management and compliance tooling, and business-setup assistance such
  as LLC formation and tax filing. ELV8 Inc. is an SEC-registered investment adviser
  and works with 30-plus college athletic programs serving thousands of athletes.
  It was surfaced as a Techstars-backed portfolio company and added to the API
  Evangelist network. Scout is a consumer/institutional fintech product and does not
  currently publish a public developer API, SDKs, or API documentation.
